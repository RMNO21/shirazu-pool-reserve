<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pool Auto-Reserve</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="header-icon">🏊‍♂️</div>
      <div>
        <h1 class="popup-title">Pool Auto-Reserve</h1>
        <p class="popup-subtitle">Shiraz University</p>
      </div>
    </div>

    <div class="popup-status-card" id="statusCard">
      <div class="status-indicator" id="statusDot"></div>
      <div class="status-text" id="statusText">Checking tab...</div>
    </div>

    <div class="popup-actions">
      <button class="btn-primary" id="openPortalBtn">Open Reservation Portal</button>
    </div>

    <div style="text-align: center; font-size: 10px; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 8px;">
      Developer: <a href="https://github.com/RMNO21" target="_blank" style="color: #0284c7; text-decoration: none; font-weight: 600;">Raman Tondro</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
